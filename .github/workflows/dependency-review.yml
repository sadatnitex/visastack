name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The dependency-review action requires GitHub Advanced Security on
    # private repositories. Run it only where it is supported so it never
    # false-fails; the main CI job runs `pnpm audit` as a GHAS-free
    # dependency vulnerability gate that works on any repository.
    if: github.event.repository.visibility == 'public'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs that introduce vulnerable dependencies.
          fail-on-severity: high
          # Block copyleft/unknown licenses from entering the tree.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
