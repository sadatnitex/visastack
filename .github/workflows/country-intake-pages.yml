name: Country intake pages

# Manual only. Opens every web page named in the country sheets (GitHub's machines have internet access) and
# saves what each page says, plus a check that the copied words appear on the cited page. It reads files and
# public web pages only: no secrets, no database, no write access to the repository.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Folder holding the three sheets
        required: false
        default: docs/product/master-profile-enrichment/country-intake/batch-001
      show_pages:
        description: Pages to print in the log, one address per space (optional, for reading them here)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: country-intake-pages
  cancel-in-progress: false

jobs:
  pages:
    name: Fetch cited pages and check quotes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Save the text of every cited page
        env:
          BATCH: ${{ inputs.batch }}
          SHOW_PAGES: ${{ inputs.show_pages }}
        run: node scripts/country-packs/fetch-pages.mjs "$BATCH" out $SHOW_PAGES

      - name: Check copied words against the cited pages
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          node scripts/country-packs/validate-intake.mjs \
            --countries "$BATCH/0-countries.csv" \
            --routes "$BATCH/1-routes.csv" \
            --requirements "$BATCH/2-requirements.csv" \
            --live --out out/live-report.csv || true

      - name: Print the quotes that were not found on their page
        run: grep -E '"(ERROR|WARN)","(QUOTE_NOT_ON_PAGE|QUOTE_PARTIAL|PAGE_UNREACHABLE)"' out/live-report.csv || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: country-intake-pages
          path: out
          retention-days: 7
