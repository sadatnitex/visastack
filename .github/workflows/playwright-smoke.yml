name: Playwright Deploy Smoke

# Browser-level verification of the deployed preview/production URL — no
# secrets required. Runs the no-secret spec only (master directive §8B);
# the credential-gated authenticated spec lives in workos-staging-e2e.yml.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  playwright:
    name: No-secret Playwright checks
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run no-secret Playwright checks against the deployed URL
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: npx playwright test no-secret-auth.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
