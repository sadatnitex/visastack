name: Playwright Deploy Smoke

# Browser-level verification of the deployed URL (production only since
# 2026-10-25; pull requests run the same specs in pr-browser-checks.yml), with no
# secrets required. Runs both no-secret specs (master directive §8B);
# the credential-gated authenticated spec lives in workos-staging-e2e.yml.
# ux-public.spec.ts (axe/responsive/keyboard/i18n/404 checks) previously
# existed but was never referenced by any workflow, so it could not fail a
# build (docs/audits/post-programme-defect-register.md finding #24) — wired
# in here alongside the existing no-secret-auth.spec.ts.
# browser-security.spec.ts (Commercial V1 SEC-02: the Content-Security-Policy is
# served, is enforced, and the app still works under it) is listed by name for
# the same reason: a spec no workflow names cannot fail a build.
#
# Light live run (30 Oct 2026): production was paused by Vercel Hobby's CPU fair-use limit, and
# most of that CPU came from this workflow running about 300 tests against the live site after
# every merge. Against production it now runs only the tests tagged `@live` (8 at this writing:
# home, sign-in, a protected page redirect, the security policy and headers, a real 404,
# readiness and one phone-width layout): 33 app requests plus 70 static files per deployment,
# measured, against 1,245 app requests plus 2,603 static files for the full 310 tests before. Pull requests
# still run every test in these specs, unchanged, on the CI machine (pr-browser-checks.yml).
# scripts/live-checks.test.mjs fails if the grep is removed or more than 12 tests carry the tag.
#
# Vercel posts several deployment statuses per deployment (for example pending, then success);
# each starts a run, and every status other than success is skipped below, so a deployment shows
# one skipped run and one real run. That is one real check per deployment, not two.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  playwright:
    name: No-secret Playwright checks
    # The migration workflow also writes a GitHub deployment record (environment
    # production-migrations) whose address is its own job page, not a website. It is not a
    # site deployment, so it is left out here.
    # The live signed-in check (environment live-check) writes one too, pointing at its job page.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'production-migrations' &&
      github.event.deployment.environment != 'live-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No concurrency group on purpose: every deployment keeps its own browser check result, so a
    # newer deployment never cancels or replaces the check of an older one.
    steps:
      # Explicit ref (master directive §8: "A deployment test may not check
      # out tests from another revision") -- same reasoning as
      # deploy-smoke.yml: pin to the exact commit deployment_status names,
      # not github.sha's default resolution for this event type.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the light no-secret Playwright checks against the deployed URL
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: npx playwright test no-secret-auth.spec.ts ux-public.spec.ts browser-security.spec.ts pwa.spec.ts --grep @live

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
