name: Playwright Deploy Smoke

# Browser-level verification of the deployed preview/production URL — no
# secrets required. Runs both no-secret specs (master directive §8B);
# the credential-gated authenticated spec lives in workos-staging-e2e.yml.
# ux-public.spec.ts (axe/responsive/keyboard/i18n/404 checks) previously
# existed but was never referenced by any workflow, so it could not fail a
# build (docs/audits/post-programme-defect-register.md finding #24) — wired
# in here alongside the existing no-secret-auth.spec.ts.
# browser-security.spec.ts (Commercial V1 SEC-02: the Content-Security-Policy is
# served, is enforced, and the app still works under it) is listed by name for
# the same reason: a spec no workflow names cannot fail a build.
# ux-bangla.spec.ts (Commercial V1 Part 9 section 4: the public pages and the
# signed-in building blocks in Bangla, on a small phone, with the Bangla
# typography rules and colour contrast) is listed by name for the same reason.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  playwright:
    name: No-secret Playwright checks
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Explicit ref (master directive §8: "A deployment test may not check
      # out tests from another revision") -- same reasoning as
      # deploy-smoke.yml: pin to the exact commit deployment_status names,
      # not github.sha's default resolution for this event type.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run no-secret Playwright checks against the deployed URL
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: npx playwright test no-secret-auth.spec.ts ux-public.spec.ts ux-bangla.spec.ts browser-security.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
