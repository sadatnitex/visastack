name: DB Migrate (manual)

# Applies the reviewed Drizzle migrations to Neon from CI, so no local
# machine is needed. Requires a repository secret `DATABASE_URL` (the Neon
# connection string). Trigger manually from the Actions tab and type
# "migrate" to confirm.
#
# `mode: repair` is a temporary addition (2026-09-17) that runs the
# one-time drizzle.__drizzle_migrations tracking repair instead of the
# normal migrator; see packages/db/src/repair-migration-tracking.ts for
# why it exists. Both this mode and that script are removed once the
# repair has been applied and verified.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm running this workflow against Neon (applies to both modes below)'
        required: true
      mode:
        description: 'migrate: apply pending migrations. repair: fix migration tracking only (temporary)'
        required: false
        default: 'migrate'
        type: choice
        options:
          - migrate
          - repair

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'migrate' }}
    name: Apply migrations to Neon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Accept any of the standard Neon/Vercel connection-string secret names;
      # both scripts resolve the first one present.
      - name: Apply migrations
        if: ${{ github.event.inputs.mode != 'repair' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
        run: pnpm --filter @visastack/db db:migrate

      - name: Repair migration tracking
        if: ${{ github.event.inputs.mode == 'repair' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
        run: pnpm --filter @visastack/db db:repair-migration-tracking
