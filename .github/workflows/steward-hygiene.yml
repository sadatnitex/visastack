name: Steward hygiene

# Removes what can be proven obsolete: git branches whose work is already on main, old workflow
# artifacts, and caches of closed pull requests or caches nobody used for a week. Everything a
# person might still want is only listed. A branch is also removed when the owner names it in
# "delete_branches" (still refused if it is protected, has an open pull request, was touched in the
# last 48 hours, or its tip moved after the owner reviewed it). Runs from the default branch, so it
# always uses trusted code. Every manual run is a dry run unless "apply" is ticked.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete for real (leave off for a dry run)'
        type: boolean
        default: false
      delete_branches:
        description: 'Branches the owner chose to drop, comma separated; add @tipsha to pin the reviewed tip'
        type: string
        default: ''

permissions:
  contents: write # delete branch refs
  actions: write # delete old artifacts and caches
  pull-requests: read

concurrency:
  group: steward-hygiene
  cancel-in-progress: false

jobs:
  sweep:
    name: Steward hygiene sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sweep
        if: ${{ !inputs.delete_branches }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          APPLY_INPUT: ${{ inputs.apply }}
        run: |
          flag=""
          if [ "$EVENT" = "schedule" ] || [ "$APPLY_INPUT" = "true" ]; then flag="--apply"; fi
          set +e
          node scripts/steward/hygiene.mjs $flag > hygiene.out
          code=$?
          { echo '```'; cat hygiene.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat hygiene.out
          exit $code

      - name: Drop the branches the owner named
        if: ${{ inputs.delete_branches }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_INPUT: ${{ inputs.apply }}
          DELETE_BRANCHES: ${{ inputs.delete_branches }}
        run: |
          flag=""
          if [ "$APPLY_INPUT" = "true" ]; then flag="--apply"; fi
          set +e
          node scripts/steward/hygiene.mjs --delete "$DELETE_BRANCHES" $flag > hygiene.out
          code=$?
          { echo '```'; cat hygiene.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat hygiene.out
          exit $code
