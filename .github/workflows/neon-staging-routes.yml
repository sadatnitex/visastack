name: Neon staging route evidence (CF-09 partial)
# Manual, trusted-code staging execution. A green run is route evidence only,
# never full visual alignment or all lifecycle acceptance.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  actual-neon-routes:
    if: github.ref == 'refs/heads/main'
    name: Actual Neon authenticated routes, zero skips
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.E2E_STAGING_BASE_URL }}
      STAGING_ATTESTATION_SECRET: ${{ secrets.STAGING_ATTESTATION_SECRET }}
      STAGING_VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
      E2E_EXPECTED_SHA: ${{ github.sha }}
      E2E_STAGING_DEPLOYMENT_ID: ${{ vars.E2E_STAGING_DEPLOYMENT_ID }}
      E2E_SYNTHETIC_ISOLATION_VERIFIED: ${{ vars.E2E_SYNTHETIC_ISOLATION_VERIFIED }}
      E2E_TRAVELLER_ID: ${{ vars.E2E_TRAVELLER_ID }}
      E2E_CASE_ID: ${{ vars.E2E_CASE_ID }}
      E2E_AGENCY_ORG_ID: ${{ vars.E2E_AGENCY_ORG_ID }}
      NEON_STAGING_TRAVELLER_EMAIL: ${{ secrets.NEON_STAGING_TRAVELLER_EMAIL }}
      NEON_STAGING_TRAVELLER_PASSWORD: ${{ secrets.NEON_STAGING_TRAVELLER_PASSWORD }}
      NEON_STAGING_OTHER_TRAVELLER_EMAIL: ${{ secrets.NEON_STAGING_OTHER_TRAVELLER_EMAIL }}
      NEON_STAGING_OTHER_TRAVELLER_PASSWORD: ${{ secrets.NEON_STAGING_OTHER_TRAVELLER_PASSWORD }}
      NEON_STAGING_AGENCY_ADMIN_EMAIL: ${{ secrets.NEON_STAGING_AGENCY_ADMIN_EMAIL }}
      NEON_STAGING_AGENCY_ADMIN_PASSWORD: ${{ secrets.NEON_STAGING_AGENCY_ADMIN_PASSWORD }}
      NEON_STAGING_AGENCY_WORKER_EMAIL: ${{ secrets.NEON_STAGING_AGENCY_WORKER_EMAIL }}
      NEON_STAGING_AGENCY_WORKER_PASSWORD: ${{ secrets.NEON_STAGING_AGENCY_WORKER_PASSWORD }}
      NEON_STAGING_PLATFORM_ADMIN_EMAIL: ${{ secrets.NEON_STAGING_PLATFORM_ADMIN_EMAIL }}
      NEON_STAGING_PLATFORM_ADMIN_PASSWORD: ${{ secrets.NEON_STAGING_PLATFORM_ADMIN_PASSWORD }}
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require exact non-production deployment and complete synthetic identities
        run: |
          node scripts/check-staging-target.mjs
          node - <<'NODE'
          const names = ['E2E_TRAVELLER_ID', 'E2E_CASE_ID', 'E2E_AGENCY_ORG_ID'];
          for (const role of ['TRAVELLER', 'OTHER_TRAVELLER', 'AGENCY_ADMIN', 'AGENCY_WORKER', 'PLATFORM_ADMIN']) names.push(`NEON_STAGING_${role}_EMAIL`, `NEON_STAGING_${role}_PASSWORD`);
          const identities = ['TRAVELLER', 'OTHER_TRAVELLER', 'AGENCY_ADMIN', 'AGENCY_WORKER', 'PLATFORM_ADMIN'].map(role => process.env[`NEON_STAGING_${role}_EMAIL`]?.toLowerCase());
          if (names.some(name => !process.env[name]) || new Set(identities).size !== 5) { console.error('BLOCKED: complete isolated synthetic role fixtures are required. No authenticated checks ran.'); process.exit(1); }
          NODE
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture ten actual routes and check role boundaries
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/neon-routes.json
        run: pnpm exec playwright test --config=playwright.neon-staging.config.ts --reporter=json > "$RUNNER_TEMP/neon-route-output.txt" 2>&1
      - name: Refuse missing, skipped or failed execution evidence
        if: always()
        run: |
          node scripts/check-authenticated-results.mjs "$RUNNER_TEMP/neon-routes.json"
          echo "Actual Neon route checks ran with zero skips. PDF comparison, every significant lifecycle and full CF-09 acceptance remain open." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain synthetic route captures for manual PDF comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: actual-neon-route-captures
          path: apps/web/test-results/**/*.png
          retention-days: 7
      - name: Remove raw authenticated diagnostic output
        if: always()
        run: rm -f "$RUNNER_TEMP/neon-routes.json" "$RUNNER_TEMP/neon-route-output.txt"

  evidence-result:
    name: Refuse skipped authenticated journey jobs
    needs: actual-neon-routes
    if: always()
    runs-on: ubuntu-latest
    env:
      JOURNEY_RESULT: ${{ needs.actual-neon-routes.result }}
    steps:
      - name: Require actual successful Neon execution
        run: |
          if [ "$JOURNEY_RESULT" != "success" ]; then
            echo "::error::BLOCKED: authenticated Neon journeys did not complete successfully. Skipped jobs are not acceptance evidence."
            echo "Authenticated Neon route evidence is blocked; CF-09 remains incomplete." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Authenticated Neon route evidence ran successfully. Full PDF and significant lifecycle acceptance remain open." >> "$GITHUB_STEP_SUMMARY"
