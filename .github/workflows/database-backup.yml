name: Encrypted Neon backup to R2

on:
  schedule:
    # Daily at 05:17 UTC (S27), off the busy top of the hour: up to a day of independent-copy
    # data loss, plus schedule delay. The Vercel freshness check runs daily at 11:07 UTC, after it,
    # with a 24-hour window, so one failed capture is caught the same day.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A short-lived client on the existing Actions runner, no external service.
    container: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    timeout-minutes: 30
    steps:
      - name: Install runner prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stream authenticated encrypted SQL backup to private R2
        env:
          BACKUP_EXPECTED_DATABASE: visastackdev
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY_BASE64: ${{ secrets.BACKUP_ENCRYPTION_KEY_BASE64 }}
          BACKUP_ENCRYPTION_KEY_ID: ${{ vars.BACKUP_ENCRYPTION_KEY_ID }}
          R2_REGION: ${{ secrets.R2_REGION }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm --filter @visastack/adapters exec tsx src/backup-neon.ts
      # Runs only after a successful capture. Report only unless the repository variable
      # BACKUP_PRUNE is exactly "on" (owner decision, S27); see docs/operations/r2-encrypted-backups.md.
      - name: Report backup storage and apply the retention rules
        env:
          BACKUP_PRUNE: ${{ vars.BACKUP_PRUNE }}
          R2_REGION: ${{ secrets.R2_REGION }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm --filter @visastack/adapters exec tsx src/backup-prune.ts
