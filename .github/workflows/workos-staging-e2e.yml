name: Legacy WorkOS staging journeys (not Neon acceptance)

# Manual legacy diagnostics only. Never proves Neon Auth acceptance.
# An explicit isolated staging URL and synthetic-isolation attestation are required.
# Missing credentials fail visibly; there is no production/deployment URL fallback.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: read

jobs:
  check-configured:
    name: Report whether staging E2E is configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required secrets
        id: check
        env:
          HAS_EMAIL: ${{ secrets.WORKOS_STAGING_TEST_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.WORKOS_STAGING_TEST_PASSWORD != '' }}
        run: |
          if [ "$HAS_EMAIL" = "true" ] && [ "$HAS_PASSWORD" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "WORKOS_STAGING_TEST_EMAIL and WORKOS_STAGING_TEST_PASSWORD are both set - running the authenticated E2E spec."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: WORKOS_STAGING_TEST_EMAIL and/or WORKOS_STAGING_TEST_PASSWORD are not set on this repository."
            echo "::error::BLOCKED: legacy authenticated journeys did not run. This is not Neon Auth acceptance."
            exit 1
          fi

  authenticated-e2e:
    name: Authenticated workspace journey (WorkOS staging)
    needs: check-configured
    if: needs.check-configured.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Explicit ref (master directive §8: "A deployment test may not check
      # out tests from another revision") -- same reasoning as
      # deploy-smoke.yml. Falls back to github.sha for the manual
      # workflow_dispatch trigger, where github.event.deployment doesn't
      # exist and github.sha already correctly resolves to whatever ref the
      # operator selected when dispatching.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the authenticated workspace journey
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL }}
          WORKOS_STAGING_TEST_EMAIL: ${{ secrets.WORKOS_STAGING_TEST_EMAIL }}
          WORKOS_STAGING_TEST_PASSWORD: ${{ secrets.WORKOS_STAGING_TEST_PASSWORD }}
          WORKOS_STAGING_TEST_EMAIL_2: ${{ secrets.WORKOS_STAGING_TEST_EMAIL_2 }}
          WORKOS_STAGING_TEST_PASSWORD_2: ${{ secrets.WORKOS_STAGING_TEST_PASSWORD_2 }}
          STAGING_ATTESTATION_SECRET: ${{ secrets.STAGING_ATTESTATION_SECRET }}
          STAGING_VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
          E2E_STAGING_DEPLOYMENT_ID: ${{ vars.E2E_STAGING_DEPLOYMENT_ID }}
          E2E_EXPECTED_SHA: ${{ github.sha }}
          E2E_AUTHENTICATED: 'true'
          E2E_SYNTHETIC_ISOLATION_VERIFIED: ${{ vars.E2E_SYNTHETIC_ISOLATION_VERIFIED }}
          E2E_AGENCY_ORG_ID: ${{ vars.E2E_AGENCY_ORG_ID }}
          E2E_AGENCY_ASSIGNED_APPLICANT_NAME: ${{ vars.E2E_AGENCY_ASSIGNED_APPLICANT_NAME }}
          E2E_AGENCY_UNASSIGNED_APPLICANT_ID: ${{ vars.E2E_AGENCY_UNASSIGNED_APPLICANT_ID }}
          E2E_AGENCY_UNASSIGNED_APPLICANT_NAME: ${{ vars.E2E_AGENCY_UNASSIGNED_APPLICANT_NAME }}
        run: |
          node ../../scripts/check-staging-target.mjs
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/legacy-journeys.json" npx playwright test authenticated-workspace.spec.ts --reporter=json
          node ../../scripts/check-authenticated-results.mjs "$RUNNER_TEMP/legacy-journeys.json"
          rm "$RUNNER_TEMP/legacy-journeys.json"


  acceptance-result:
    name: Legacy journey execution result (not Neon acceptance)
    if: always()
    needs: [check-configured, authenticated-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Refuse skipped or failed authenticated execution
        env:
          RESULT: ${{ needs.authenticated-e2e.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Authenticated journey execution is BLOCKED or failed. No acceptance evidence."
            exit 1
          fi
          echo "Legacy WorkOS diagnostics executed. Neon and full CF-09 acceptance remain unverified." >> "$GITHUB_STEP_SUMMARY"
