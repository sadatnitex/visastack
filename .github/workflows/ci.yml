name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Layout: independent jobs run side by side, and one final job carries the required check name
# "Lint · Build · Typecheck · Test", passing only when every other job passed. Until 2026-10-25
# this was one serial job of about 25-35 minutes, almost all of it the test step.
#
# Every job checks out the exact commit under test (master directive §8: "A deployment test may
# not check out tests from another revision"). Without an explicit ref, actions/checkout on a
# pull_request event uses GitHub's synthetic refs/pull/N/merge commit, not the PR's head SHA (the
# commit Vercel builds as the preview and the one that becomes the merge parent). On push,
# github.sha already is the deployed commit, so the fallback is a no-op there.

jobs:
  static:
    name: Lint and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GHAS-free dependency vulnerability gate (works on private repos).
      # Hard gate on what we actually ship (production deps); dev-tooling
      # advisories are surfaced but do not block, since they never deploy.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit dev dependencies (informational)
        run: pnpm audit --dev --audit-level high || true

      - name: Lint & format check
        run: pnpm run lint

      - name: Supply-chain checks, self-tests
        run: node --test scripts/supply-chain/checks.test.mjs

      - name: Repository script self-tests
        # The same list `pnpm test` runs locally, so local and CI cannot drift apart.
        run: pnpm run test:node

  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history so the secret scan can read every past commit.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: Next.js generates next-env.d.ts and .next/types,
      # which the typecheck step depends on.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Authentication redirect guard checks
        run: node --test apps/web/tests/auth-redirect.node.mjs

      # Scans that really run on this private repository (CodeQL and
      # dependency review do not). Needs the production build above for the
      # browser bundle check. A skipped check fails the job here: skipped is
      # reported on its own and is never counted as a pass.
      - name: Supply-chain checks, scans
        run: node scripts/supply-chain/scan.mjs --no-skips --json supply-chain-report.json

      - name: Upload supply-chain report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-report
          path: supply-chain-report.json
          if-no-files-found: ignore
          retention-days: 30

  test-services:
    name: Test services (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The service suite is the largest by far, so it is split by file into six shards that
      # run at the same time (three took about 7 minutes each and held up every pull request).
      # Every shard runs the whole of its share; nothing is skipped. One worker per core (four on
      # the public-repository runner; measured 31 Oct 2026: shard 1 took 295 s with two workers,
      # 208 s with four). A percentage, so a smaller runner never gets more workers than cores.
      - name: Test
        run: pnpm --filter @visastack/services test --shard=${{ matrix.shard }}/6 --maxWorkers=100%

  test-web:
    name: Test web (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The web suite (about 400 files) was the longest job once the services were split, so it
      # is split by file into three shards too. Packages load from source, so no build is needed
      # first. Every shard runs the whole of its share; nothing is skipped. One worker per core, as
      # above (measured 31 Oct 2026: shard 1 took 79 s with two workers, 52 s with four).
      - name: Test
        run: pnpm --filter @visastack/web test --shard=${{ matrix.shard }}/3 --maxWorkers=100%

  test-packages:
    name: Test other packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Real malware-engine verification (Commercial V1 SEC-05/EVI-02):
      # installs and starts an actual ClamAV daemon so
      # clamav-scanner.test.ts's live describe block genuinely exercises
      # `ClamAvScanner` against real `clamd`, not only the fake-protocol
      # server the rest of that file uses. Deliberately never fails the
      # job on its own: if signature download or startup has a transient
      # problem, `CLAMAV_TEST_SOCKET_PATH` is simply left unset and the
      # live block skips (documented, not a silent fake pass) rather than
      # blocking CI on a third-party mirror's availability, which is not
      # this repository's own correctness. A minimal EICAR-only signature
      # (the same public, standardized AV test string the test suite
      # itself uses) is the fallback when the full signature database
      # cannot be fetched, so the live path still runs whenever possible.
      - name: Install and start ClamAV for live scanner verification
        run: |
          set +e
          # apt-get update can exit non-zero over an unrelated third-party
          # source (a stale PPA signing key, a mirror hiccup) while the
          # primary Ubuntu archives it actually needs still refresh fine --
          # gating on the INSTALL's own exit code, not update's, is what
          # actually tells us whether clamav is fetchable.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav-daemon clamav-freshclam
          if [ $? -ne 0 ]; then
            echo "::warning::ClamAV install failed; live scanner verification will be skipped"
            exit 0
          fi
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || echo "::warning::freshclam failed; falling back to a minimal EICAR-only test database"
          if ! ls /var/lib/clamav/*.cvd /var/lib/clamav/*.cld >/dev/null 2>&1; then
            EICAR_MD5=$(printf 'X5O!P%%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' | md5sum | cut -d' ' -f1)
            echo "${EICAR_MD5}:68:CI-Fallback-EICAR" | sudo tee /var/lib/clamav/eicar.hdb >/dev/null
            sudo chown clamav:clamav /var/lib/clamav/eicar.hdb
          fi
          sudo mkdir -p /var/run/clamav && sudo chown clamav:clamav /var/run/clamav
          sudo -u clamav /usr/sbin/clamd --config-file=/etc/clamav/clamd.conf &
          for _ in $(seq 1 30); do
            if printf 'PING\n' | sudo -u clamav timeout 2 nc -U /var/run/clamav/clamd.ctl 2>/dev/null | grep -q PONG; then
              echo "CLAMAV_TEST_SOCKET_PATH=/var/run/clamav/clamd.ctl" >> "$GITHUB_ENV"
              echo "clamd is up"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::clamd did not become ready in time; live scanner verification will be skipped"
          exit 0

      - name: Test
        # The packages other than services and web (their own jobs above). Bound concurrent
        # database-heavy packages and use two Vitest workers rather than the runner's one-worker
        # default.
        run: pnpm exec turbo run test --filter=!@visastack/services --filter=!@visastack/web --concurrency=2 -- --maxWorkers=2

  verify:
    # The required status check. Keep this name: branch protection matches on it.
    name: Lint · Build · Typecheck · Test
    # Always runs, so a failed, skipped or cancelled job turns the check red. A skipped required
    # check counts as passed, so this job must never be skipped itself.
    if: always()
    needs: [static, build, test-services, test-web, test-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
