name: Deploy Smoke

# Vercel's GitHub App creates a GitHub Deployment + deployment_status for every
# deployment (since 2026-10-25 only production: previews are off, and pull requests
# run the same check in pr-browser-checks.yml); `state: success` carries the live URL in
# `environment_url` / `target_url`. This runs the no-secret smoke check
# (master directive §8A) against that exact deployed URL — never localhost —
# with no repository secrets required.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    name: No-secret smoke check
    # The migration workflow also writes a GitHub deployment record (environment
    # production-migrations) whose address is its own job page, not a website. It is not a
    # site deployment, so it is left out here.
    # The live signed-in check (environment live-check) writes one too, pointing at its job page.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'production-migrations' &&
      github.event.deployment.environment != 'live-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Explicit ref (master directive §8: "A deployment test may not check
      # out tests from another revision"). deployment_status carries the
      # exact commit that was actually deployed in its own event payload --
      # pin to it explicitly rather than relying on github.sha's default
      # resolution for this event type, so scripts/smoke.mjs always runs at
      # the same revision as the deployment it's checking.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run smoke checks against the deployed URL
        working-directory: apps/web
        env:
          SMOKE_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: node scripts/smoke.mjs
        id: smoke

      # Release record (Commercial V1 Part 9 section 13): the code SHA, the deployment, the
      # environment, the newest migration in the repository at that commit, and the smoke result,
      # kept as a workflow artifact and shown in the run summary. Runs even if the smoke failed,
      # because a failed deployment is part of the record.
      # (Skipped for a deployment of an older commit that does not have the script yet: this
      # workflow runs from the default branch, the script from the deployed commit.)
      - name: Write the release record
        if: always() && hashFiles('apps/web/scripts/release-record.mjs') != ''
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          node apps/web/scripts/release-record.mjs "$GITHUB_EVENT_PATH" "$SMOKE_OUTCOME" > release-record.json
          { echo '### Release record'; echo '```json'; cat release-record.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the release record
        if: always() && hashFiles('apps/web/scripts/release-record.mjs') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-record-${{ github.event.deployment.sha }}-${{ github.event.deployment.id }}
          path: release-record.json
          retention-days: 90
